<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bem-vindo ao Opportuning!</title>
  <style>
    body {
      background: linear-gradient(120deg, #4f8cff 0%, #38e8ff 100%);
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 48px 32px;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 1.2s;
    }
    h1 {
      color: #2563eb;
      margin-bottom: 12px;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }
    p {
      color: #333;
      font-size: 1.2rem;
      margin-bottom: 32px;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover {
      background: #1749b1;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px);}
      to { opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bem-vindo, Bruno! 👋</h1>
    <p>Este é o <strong>Opportuning</strong>, um sistema inovador para mostrar todo o nosso potencial.<br>
    Explore, aproveite e surpreenda-se!</p>
    <a href="#" class="btn">Começar</a>
  </div>
</body>
</html>
